<div class="songs-page">
  <!-- Search Bar for Millions of Songs -->
  <div class="header-controls">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search millions of Bollywood, Punjabi & International songs...</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [ngModel]="searchQuery" (ngModelChange)="onSearch($event)" autocomplete="off" placeholder="e.g. Arijit Singh, Kesariya, Diljit, Drake...">
    </mat-form-field>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-center" *ngIf="loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <!-- Live Songs Grid -->
  <ng-container *ngIf="!loading">
    <div class="songs-grid" *ngIf="songs.length > 0">
      <app-song-card
        *ngFor="let song of songs"
        [song]="song"
        [isLoggedIn]="isLoggedIn"
        (favoriteToggled)="toggleFavorite($event)"
        (addToPlaylist)="openAddToPlaylist($event)">
      </app-song-card>
    </div>

    <div class="empty-state" *ngIf="songs.length === 0">
      <mat-icon>music_off</mat-icon>
      <h3>No songs found</h3>
      <p>Try searching for 'Arijit Singh', 'Tum Hi Ho', 'Pritam', or 'Taylor Swift'</p>
    </div>
  </ng-container>
</div>
